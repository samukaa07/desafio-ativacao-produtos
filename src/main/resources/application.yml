spring:
  application:
    name: activation-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activation_db}
    username: ${DB_USER:activation}
    password: ${DB_PASSWORD:activation}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
provider:
  base-url: ${PROVIDER_BASE_URL:http://localhost:8080}
  connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:2s}
  read-timeout: ${PROVIDER_READ_TIMEOUT:5s}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
